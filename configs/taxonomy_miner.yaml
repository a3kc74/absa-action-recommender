candidate_filter:
  weak_score_threshold: 0.45
  high_risk_score_threshold: 0.70
  only_negative: true
  include_generic: true
  include_needs_review: true

vectorizer:
  char_ngram_range: [3, 5]
  word_ngram_range: [1, 3]
  min_df: 2
  max_df: 0.90

clustering:
  algorithm: agglomerative
  distance_threshold: 0.55
  min_cluster_size: 3
  max_clusters_per_aspect: 20

reporting:
  top_phrases_per_cluster: 8
  representative_annotations_per_cluster: 5
  include_small_high_risk_clusters: true

suggestion:
  existing_subproblem_similarity_threshold: 0.40
  create_new_subproblem_threshold: 0.30
