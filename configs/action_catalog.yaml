Food Quality:
  generic_food_quality_issue:
    actions:
      - "Rà soát chất lượng món, công thức chuẩn và phản hồi gần đây theo ca."
    kpis:
      - food_quality_negative_rate_30d
  bland_or_no_flavor:
    actions:
      - "Rà soát định lượng nước dùng, gia vị và nguyên liệu chính trong công thức chuẩn."
      - "Tổ chức tasting nội bộ đầu ca cho các món bị phàn nàn nhiều."
    kpis:
      - food_quality_negative_rate_30d
      - bland_food_mentions_30d

Food Safety:
  generic_food_safety_issue:
    actions:
      - "Kích hoạt kiểm tra an toàn thực phẩm cho phản hồi liên quan."
    kpis:
      - food_safety_negative_rate_30d
  suspected_food_poisoning_or_sickness:
    actions:
      - "Kích hoạt quy trình kiểm tra an toàn thực phẩm và lưu mẫu liên quan."
    kpis:
      - food_safety_incidents_30d

Service:
  generic_service_issue:
    actions:
      - "Rà soát quy trình phục vụ, phân công nhân viên và phản hồi theo ca."
    kpis:
      - service_negative_rate_30d
  inconsistent_service_response:
    actions:
      - "Chuẩn hóa kịch bản phản hồi về trạng thái món và order."
    kpis:
      - inconsistent_service_mentions_30d
  slow_food_or_drink_preparation:
    actions:
      - "Đo thời gian ra món theo nhóm món và khung giờ."
    kpis:
      - preparation_delay_mentions_30d

Price:
  generic_price_issue:
    actions:
      - "Rà soát cảm nhận giá trị, khẩu phần và cách hiển thị giá."
    kpis:
      - price_negative_rate_30d
  overpriced:
    actions:
      - "Đánh giá lại cảm nhận giá so với khẩu phần và chất lượng."
    kpis:
      - price_negative_rate_30d

Cleanliness:
  generic_cleanliness_issue:
    actions:
      - "Tăng kiểm tra vệ sinh theo checklist và ghi nhận trách nhiệm từng ca."
    kpis:
      - cleanliness_negative_rate_30d
  dirty_tableware:
    actions:
      - "Kiểm tra lại quy trình rửa và soi dụng cụ trước khi phục vụ."
      - "Loại bỏ dụng cụ có vết mốc hoặc vết bẩn khó xử lý."
    kpis:
      - dirty_tableware_mentions_30d

Ambience:
  generic_ambience_issue:
    actions:
      - "Rà soát các yếu tố không gian như tiếng ồn, ánh sáng, nhiệt độ và bố trí."
    kpis:
      - ambience_negative_rate_30d
  noisy_or_crowded:
    actions:
      - "Điều chỉnh bố trí bàn và kiểm soát đặt chỗ giờ cao điểm."
    kpis:
      - noisy_crowded_mentions_30d

Location:
  generic_location_issue:
    actions:
      - "Cập nhật thông tin vị trí, hướng dẫn đường đi và các tiện ích xung quanh."
    kpis:
      - location_negative_rate_30d
  hard_to_find:
    actions:
      - "Cập nhật chỉ dẫn đường đi, bảng hiệu và thông tin bản đồ."
    kpis:
      - hard_to_find_mentions_30d
  parking_issue:
    actions:
      - "Cập nhật thông tin chỗ gửi xe, phí và khoảng cách đi bộ."
      - "Làm việc với điểm gửi xe gần quán nếu cần."
    kpis:
      - parking_issue_mentions_30d

Menu:
  generic_menu_issue:
    actions:
      - "Rà soát nội dung menu, tình trạng món, ảnh món và thông tin giá."
    kpis:
      - menu_negative_rate_30d
  menu_item_unavailable:
    actions:
      - "Đồng bộ tình trạng hết món giữa bếp, phục vụ và menu."
      - "Ẩn hoặc đánh dấu món hết trên kênh online."
    kpis:
      - unavailable_menu_item_mentions_30d
  menu_photo_mismatch:
    actions:
      - "Cập nhật ảnh menu sát với khẩu phần và trình bày thực tế."
    kpis:
      - menu_photo_mismatch_mentions_30d

Unknown:
  generic_unknown_issue:
    actions:
      - "Kiểm tra thủ công nhóm phản hồi chưa được phân loại."
    kpis:
      - unknown_negative_rate_30d
